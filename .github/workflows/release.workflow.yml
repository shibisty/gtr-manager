name: Release

# Move this file to .github/workflows/release.workflow.yml (replacing the old one).
# Pushing a tag v1.2.3 (gtr version patch && gtr publish) builds archives for
# every platform with gtr-manager itself (gtr build, the "build" block of
# gtr.json) and publishes them, with SHA256SUMS, as the GitHub release v1.2.3.
# gtr installs gtr-manager from these releases (ADR-0008).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: test
        run: go test -race ./...
      - name: build
        # gtr-manager builds its own release from this commit (no download).
        run: |
          version="${GITHUB_REF_NAME#v}"
          go build -o "$RUNNER_TEMP/gtr-manager" ./cmd/gtr-manager
          "$RUNNER_TEMP/gtr-manager" build --all-targets --archive --version "$version"
          echo "DIST=build/$version" >> "$GITHUB_ENV"
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" "$DIST"/*.zip "$DIST"/*.tar.gz "$DIST"/SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --generate-notes $prerelease

{{define "title"}}Register · {{.App}}{{end}}
{{define "content"}}
<h1>Register</h1>
<form class="card" method="post" action="/register">
  {{.CSRFField}}
  <label>Name
    <input name="name" value="{{.Name}}" required autofocus>
    {{with .Errors}}{{template "error" index . "name"}}{{end}}
  </label>
  <label>Email
    <input name="email" type="email" value="{{.Email}}" required>
    {{with .Errors}}{{template "error" index . "email"}}{{end}}
  </label>
  <label>Password
    <input name="password" type="password" minlength="8" required>
    {{with .Errors}}{{template "error" index . "password"}}{{end}}
  </label>
  <label>Confirm password
    <input name="password_confirmation" type="password" required>
    {{with .Errors}}{{template "error" index . "password_confirmation"}}{{end}}
  </label>
  <button>Register</button>
</form>
{{end}}
